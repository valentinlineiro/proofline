name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      # Same one-time, networked step as the README: fills the Maven cache volume. The tests then run with --network none.
      - run: python -m proofline.runner
      # No MODEL_API_KEY needed: the model API boundary is mocked, everything else (Docker, Maven) is real.
      - run: pytest -q
