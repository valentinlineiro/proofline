[project]
name = "proofline"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["openai", "python-dotenv", "fastapi", "uvicorn"]

[project.scripts]
proofline = "proofline.cli:main"

[project.optional-dependencies]
dev = ["pytest", "httpx"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
